name: Serenity CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Test backend
        working-directory: backend
        run: |
          python -m pytest -q
          python -m compileall -q app

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Verify frontend
        working-directory: frontend
        run: |
          npm run typecheck
          npm run build

      - name: Validate Docker Compose
        env:
          ADMIN_PASSWORD: ci-admin-password-123456
          JWT_SECRET: ci-jwt-secret-value-with-more-than-32-characters
          POSTGRES_PASSWORD: ci-postgres-password
        run: docker compose config

      - name: Secret-like scan
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path(".")
          skip_dirs = {".git", "node_modules", "dist", "__pycache__", ".pytest_cache"}
          skip_files = {"package-lock.json"}
          pattern = re.compile(
              r"sk-[A-Za-z0-9_-]{20,}|"
              r"AKIA[0-9A-Z]{16}|"
              r"AIza[0-9A-Za-z_-]{35}|"
              r"xox[baprs]-[0-9A-Za-z-]+|"
              r"Bearer [A-Za-z0-9._-]{20,}|"
              r"secret_id\s*=\s*['\"][^'\"]+|"
              r"secret_key\s*=\s*['\"][^'\"]+"
          )
          matches: list[str] = []
          for path in root.rglob("*"):
              if not path.is_file():
                  continue
              if path.name in skip_files or any(part in skip_dirs for part in path.parts):
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              for line_no, line in enumerate(text.splitlines(), start=1):
                  if pattern.search(line):
                      matches.append(f"{path}:{line_no}")
          if matches:
              print("Secret-like values found:")
              print("\n".join(matches))
              sys.exit(1)
          print("No secret-like values found.")
          PY
